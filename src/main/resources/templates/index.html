<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка файла</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
    <h1>Загрузите файл для обработки</h1>
</header>
<main>
    <form id="uploadForm">
        <input type="file" id="fileInput" name="file" required />
        <div>
            <label>
                <input type="radio" name="action" value="zip" checked />
                Архивация ZIP
            </label>
            <label>
                <input type="radio" name="action" value="rar" />
                Архивация RAR
            </label>
            <label>
                <input type="checkbox" id="encryptCheckbox" />
                Шифровка
            </label>
            <label>
                <input type="radio" name="action" value="plain" />
                Обработанный файл
            </label>
        </div>
        <button type="submit">Загрузить</button>
    </form>
    <div id="result"></div>
</main>
<script src="/js/script.js"></script>
</body>
</html>
